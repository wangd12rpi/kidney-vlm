name: vqa_common
instantiate_model: true

model_name_or_path: Qwen/Qwen3.5-9B
trust_remote_code: true
load_in_8bit: true
torch_dtype: bfloat16
autocast_dtype: float16
projector_dtype: float32
attn_implementation: sdpa
gradient_checkpointing: true
gradient_checkpointing_use_reentrant: false
# If true, launch with torchrun; GPU ranks come from LOCAL_RANK, not YAML.
ddp: false
seed: 42

dataset:
  vqa_parquet_path: ${project.root_dir}/data/vqa/merged_vqa.parquet
  train_split: train
  validation_split: val
  question_types:
    - mcq
  generation_types:
    - from_caption
  modality_combination_names:
    - all_available
  project_ids: []
  task_categories: []
  task_ids:
    - pathology_findings
  max_train_samples:
  max_val_samples:
  sample_train: false
  sample_val: false
  sample_seed: 42

prompt:
  system_prompt: You are OncoVLM, a multimodal cancer assistant. Use only the provided multimodal evidence to answer the question.
  mcq_response_instruction: Return only the exact text of one choice. Do not explain. Do not say that the information is insufficient.
  cot_mcq_response_instruction: Use only the provided multimodal evidence. In <think>, write a concise reasoning paragraph that starts from supported patient evidence, compares the displayed choices, and explains why the final choice matches better than the others. In <answer>, put only the exact text of one choice. Do not answer with A/B/C/D.
  open_response_instruction: Answer concisely.

preview:
  num_train_samples: 5
  exit_after_preview: false

prefix_cache:
  enabled: true
  cache_root: data/vqa/prefix_cache
  scan_before_training: true
  skip_missing_rows: true
  max_missing_examples: 10
  max_prefix_tokens:
    pathology: 512
    radiology: 256
    dnam:
    rna:

lora:
  r: 8
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

projectors:
  pathology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/pathology/path_resampler_20260417_180638_EST/best.ckpt
    max_tokens: 4096
    patch_compression_method: none
    patch_compression_kernel_size: 1
    token_dropout_prob: 0.0
  radiology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/radiology/radiology_remote_weights_20260423_000000_EST/best.ckpt
    max_tokens: 32
    token_dropout_prob: 0.0
  dnam:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/dnam/dnam_mlp_20260420_025027_EST/best.ckpt
    max_tokens: 8
  rna:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/rna/rna_remote_weights_20260423_000000_EST/best.ckpt
    max_tokens: 8

max_text_length: 1024
dataloader_num_workers: 8

output_dir: ${project.root_dir}/outputs/oncovlm
run_name:
save_every_epoch: false
save_tokenizer_snapshot: true

wandb:
  enabled: true
  project: oncovlm
  entity: d0nnw0n9-rensselaer-polytechnic-institute
  mode: online
  log_every_n_steps: 4
  tags:
    - vqa_train
    - lora

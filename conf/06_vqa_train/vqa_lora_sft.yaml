name: vqa_lora_sft
instantiate_model: true

model_name_or_path: Qwen/Qwen3.5-9B
trust_remote_code: true
load_in_8bit: true
torch_dtype: bfloat16
autocast_dtype: float16
projector_dtype: float32
attn_implementation:
gradient_checkpointing: true
gradient_checkpointing_use_reentrant: false
device: cuda:0
seed: 42

dataset:
  vqa_parquet_path: ${project.root_dir}/data/vqa/gt_mcq_questions.parquet
  train_split: train
  validation_split: val
  # Empty lists mean "all values". Modality-dropout rows are kept as long as
  # their use_* flags only require enabled projectors.
  question_types:
    - mcq
    - qa
    - open_ended
    - open ended
  generation_types: []
  project_ids: []
  task_categories: []
  task_ids: []
  max_train_samples:
  max_val_samples:
  sample_train: false
  sample_val: false
  sample_seed: 42

prompt:
  system_prompt: You are OncoVLM, a multimodal cancer assistant. Use only the provided projector features to answer.
  mcq_response_instruction: Answer with the exact choice text.
  open_response_instruction: Answer concisely.

preview:
  num_train_samples: 0
  exit_after_preview: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

projectors:
  pathology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/pathology/path_resampler_20260417_180638_EST/best.ckpt
    max_tokens: 4096
    patch_compression_method: none
    patch_compression_kernel_size: 1
    token_dropout_prob: 0.0
  radiology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/radiology/radiology_remote_weights_20260423_000000_EST/best.ckpt
    max_tokens: 32
    token_dropout_prob: 0.0
  dnam:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/dnam/dnam_mlp_20260420_025027_EST/best.ckpt
    max_tokens: 8
  rna:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/qwen3_5_9b/rna/rna_remote_weights_20260423_000000_EST/best.ckpt
    max_tokens: 8

batch_size: 1
num_epochs: 3
learning_rate: 2e-5
weight_decay: 0.0
gradient_accumulation_steps: 16
grad_clip_norm: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
warmup_steps:
max_text_length: 1024
dataloader_num_workers: 8
validation:
  enabled: true
  required: false

output_dir: ${project.root_dir}/outputs/oncovlm
run_name:
save_every_epoch: false
save_tokenizer_snapshot: true

wandb:
  enabled: true
  project: oncovlm
  entity: d0nnw0n9-rensselaer-polytechnic-institute
  mode: online
  tags:
    - vqa_train
    - lora
    - sft

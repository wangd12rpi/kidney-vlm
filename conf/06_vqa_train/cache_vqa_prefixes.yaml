projectors:
  pathology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/gemma_4_e4b_it/pathology/path_resampler_20260422_002758_EST/best.ckpt
    max_tokens: 20000
    patch_compression_method: none
    patch_compression_kernel_size: 1
    token_dropout_prob: 0.0
  radiology:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/gemma_4_e4b_it/radiology/best.ckpt
    max_tokens: 4000
    token_dropout_prob: 0.0
  dnam:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/gemma_4_e4b_it/dnam/dnam_mlp_20260423_012429_EST/best.ckpt
    max_tokens: 80
  rna:
    enabled: true
    trainable: false
    checkpoint_path: outputs/projectors/gemma_4_e4b_it/rna/best.ckpt
    max_tokens: 80

name: vqa_eval_v2

run:
  name: smoke_test
  output_root: ${project.root_dir}/results
  resume_existing: true
  include_prompt_in_predictions: false
  print_first_n_outputs: 10
  dry_run: false

data:
  vqa_parquet_path: ${project.root_dir}/data/vqa/gt_mcq_questions.parquet

models:
  gpt_5_1:
    enabled: false
    backend: azure_openai_gpt
    model_name_or_path: ${oc.env:AZURE_OPENAI_DEPLOYMENT,gpt-5.1}
    batch_size: 1
    azure_openai:
      endpoint: ${oc.env:AZURE_OPENAI_ENDPOINT,https://azure-openai-radi.cognitiveservices.azure.com/}
      deployment: ${oc.env:AZURE_OPENAI_DEPLOYMENT,gpt-5.1}
      api_version: ${oc.env:AZURE_OPENAI_API_VERSION,2024-12-01-preview}
      api_key_env: AZURE_OPENAI_API_KEY
      max_completion_tokens: 256
      max_retries: 3
      retry_sleep_seconds: 2.0
      reasoning_effort: low
      verbosity: low

  medgemma_27b_it:
    enabled: true
    backend: hf_image_text_to_text
    model_name_or_path: google/medgemma-27b-it
    trust_remote_code: true
    load_in_8bit: true
    torch_dtype: bfloat16
    attn_implementation: sdpa
    device: cuda:0
    batch_size: 2

  oncovlm_qwen_no_finetune:
    enabled: true
    backend: oncovlm_projector
    model_name_or_path: Qwen/Qwen3.5-9B
    trust_remote_code: true
    load_in_8bit: true
    torch_dtype: bfloat16
    autocast_dtype: float16
    projector_dtype: float32
    attn_implementation: sdpa
    device: cuda:0
    batch_size: 1
    enable_thinking: false
    projectors:
      pathology:
        checkpoint_path: outputs/projectors/qwen3_5_9b/pathology/path_resampler_20260417_180638_EST/best.ckpt
        max_tokens: 512
        patch_compression_method: none
        patch_compression_kernel_size: 1
        token_dropout_prob: 0.0
      radiology:
        checkpoint_path: outputs/projectors/qwen3_5_9b/radiology/radiology_remote_weights_20260423_000000_EST/best.ckpt
        max_tokens: 256
        token_dropout_prob: 0.0
      dnam:
        checkpoint_path: outputs/projectors/qwen3_5_9b/dnam/dnam_mlp_20260420_025027_EST/best.ckpt
        max_tokens: 32
      rna:
        checkpoint_path: outputs/projectors/qwen3_5_9b/rna/rna_remote_weights_20260423_000000_EST/best.ckpt
        max_tokens: 32

filters:
  split:
    enabled: true
    value: test
  question_types:
    enabled: true
    values: [mcq]
  project_ids:
    enabled: true
    values: [TCGA-BRCA]
  generation_types:
    enabled: false
    values: []
  task_categories:
    enabled: false
    values: []
  task_ids:
    enabled: false
    values: []
  allowed_modality_combo:
    enabled: false
    values: []
  nonempty_enabled_genomics_text:
    enabled: true
  row_limit:
    enabled: false
    max_rows: 20
    sample: true
    sample_seed: 17

sampling:
  enabled: true
  ratio: 0.3
  min_per_group: 20
  seed: 42
  group_by:
    - question_type
    - generation_type
    - task_category
    - task_id
    - modality_combination_name

prompts:
  mcq:
    system_prompt: >-
      You are OncoVLM, a multimodal cancer assistant. This is a forced-choice
      predictive benchmark. Use only the provided evidence and choose the most
      likely listed option.
    response_instruction: >-
      Return only the exact text of one choice. Do not explain. Do not say that
      the information is insufficient.
  qa:
    system_prompt: >-
      You are OncoVLM, a multimodal cancer assistant. Use only the provided
      projector features to answer.
    response_instruction: >-
      Answer concisely.

generation:
  max_new_tokens: 256
  do_sample: false
  temperature:
  top_p:

metrics:
  bert_score:
    enabled: true
    model_type: roberta-large
    lang: en
    batch_size: 8
    rescale_with_baseline: true

image_inputs:
  enabled: true
  ignore_radiology_biomarker: true
  max_pathology_images: 16
  max_radiology_images: 16
  allowed_extensions: [.png, .jpg, .jpeg]

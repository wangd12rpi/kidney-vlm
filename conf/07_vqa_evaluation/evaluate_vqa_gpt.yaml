name: vqa_eval_gpt_mcq_smoke
vqa_parquet_path: ${project.root_dir}/data/vqa/gt_mcq_questions.parquet
output_dir: ${project.root_dir}/output/vqa_eval/gpt_mcq_brca_smoke
predictions_path: ${vqa_evaluation.output_dir}/predictions.parquet
metrics_path: ${vqa_evaluation.output_dir}/metrics.json

backend: azure_openai_gpt
overwrite_predictions: false
resume_existing: true
include_prompt_in_predictions: false
dry_run: false

filters:
  # Disable any filter by setting enabled: false.
  split:
    enabled: true
    value: test
  question_types:
    enabled: true
    values: [mcq]
  project_ids:
    enabled: true
    values: [TCGA-BRCA]
  task_ids:
    enabled: false
    values:
      - mutation_tp53
      - mutation_pik3ca
      - pathologic_stage
  task_categories:
    enabled: false
    values: []
  allowed_modality_combo:
    enabled: true
    values:
      - {path: true, rad: false, dnam: true, rna: true}
      - {path: true, rad: false, dnam: false, rna: false}
  nonempty_enabled_genomics_text:
    enabled: true
  row_limit:
    enabled: false
    max_rows: 20
    sample: true
    sample_seed: 17

image_inputs:
  enabled: true
  max_pathology_images: 10
  max_radiology_images: 10
  allowed_extensions: [.png, .jpg, .jpeg]

system_prompt: >-
  Answer the multiple-choice question using only the provided evidence.
response_instruction: >-
  Return strict JSON only with key: answer. The answer value must exactly match
  one option text.

azure_openai:
  endpoint: ${oc.env:AZURE_OPENAI_ENDPOINT,https://azure-openai-radi.cognitiveservices.azure.com/}
  deployment: ${oc.env:AZURE_OPENAI_DEPLOYMENT,gpt-5.1}
  api_version: ${oc.env:AZURE_OPENAI_API_VERSION,2024-12-01-preview}
  api_key_env: AZURE_OPENAI_API_KEY
  max_completion_tokens: 256
  max_retries: 3
  retry_sleep_seconds: 2.0
  reasoning_effort: low
  verbosity: low

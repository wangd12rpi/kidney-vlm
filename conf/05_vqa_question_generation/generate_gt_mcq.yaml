name: vqa_question_generation_gt_mcq
source_registry_path: ${data.unified_registry_path}
output_parquet_path: ${project.root_dir}/data/vqa/gt_mcq_questions.parquet
full_output_parquet_path: ${project.root_dir}/data/vqa/gt_mcq_questions_full.parquet
print_first_n: 5
first_n:
allowed_project_ids: []
allowed_splits: []
choice_count: 4
min_semantic_questions_per_project_task: 20
require_test_pathology_roi_png_dir: true
require_test_radiology_view_png_dir: true
radiology_png_root: data/radiology_png
max_test_radiology_images: 6
populate_test_genomics_text_summaries: true
require_test_genomics_text_summaries: true
dnam_text_summary_max_beta_values: 50000
rna_text_summary_max_top_genes: 8
show_progress: true
skip_values:
  - ""
  - None
  - nan
  - Not Reported
  - Unknown
  - Not Available

sampling:
  enabled: true
  seed: 42
  splits:
    - train
  # Radiology-bearing cases are rare; when enabled, keep any base question whose
  # source case has radiology features, then sample only from the no-radiology majority.
  protect_radiology_questions: true
  default_keep_ratio: 1.0
  task_category_keep_ratios:
    mutation: 0.6
    pathologic_t: 0.4
    pathologic_n: 0.4
    stage: 0.6
  task_id_keep_ratios: {}

default_modality_combinations:
  - name: all_available
    use_pathology: must_have             # path must have, other use if avail
    use_radiology: use_if_avail
    use_dnam: use_if_avail
    use_rna: use_if_avail

  - name: path_only
    use_pathology: must_have             # path must have
    use_radiology: not_include
    use_dnam: not_include
    use_rna: not_include


  - name: radiology_only
    use_pathology: not_include           # rad must have
    use_radiology: must_have
    use_dnam: not_include
    use_rna: not_include




categorical_tasks:
  - enabled: true
    task_category: stage
    task_id: pathologic_stage
    source_column: task_stage_label
    ground_truth_source: task_stage_label
    question_template: What is the AJCC pathologic stage for this case?
    options:
      - Stage I
      - Stage II
      - Stage III
      - Stage IV
    value_map:
      Stage I: Stage I
      Stage IA: Stage I
      Stage IB: Stage I
      Stage IB1: Stage I
      Stage IC: Stage I
      Stage IS: Stage I
      Stage II: Stage II
      Stage IIA: Stage II
      Stage IIB: Stage II
      Stage IIC: Stage II
      Stage III: Stage III
      Stage IIIA: Stage III
      Stage IIIB: Stage III
      Stage IIIC: Stage III
      Stage IV: Stage IV
      Stage IVA: Stage IV
      Stage IVB: Stage IV
      Stage IVC: Stage IV
    skip_values:
      - Stage 0
      - Stage 0a
      - Stage 0is
      - Stage X


  - enabled: true
    task_category: grade
    task_id: tumor_grade
    source_column: task_grade_label
    ground_truth_source: task_grade_label
    question_template: What is the tumor grade label for this case?
    options:
      - G1
      - G2
      - G3
      - G4
    value_map:
      G1: G1
      G2: G2
      G3: G3
      G4: G4
    skip_values:
      - High Grade
      - Low Grade
      - GX
      - GB


  - enabled: true
    task_category: stage_component
    task_id: pathologic_t
    source_column: ajcc_pathologic_t
    ground_truth_source: ajcc_pathologic_t
    question_template: What is the AJCC pathologic T category for this case?
    options:
      - T1
      - T2
      - T3
      - T4
    value_map:
      T1: T1
      T1a: T1
      T1b: T1
      T1b1: T1
      T1b2: T1
      T1c: T1
      T2: T2
      T2a: T2
      T2a1: T2
      T2a2: T2
      T2b: T2
      T2c: T2
      T3: T3
      T3a: T3
      T3b: T3
      T3c: T3
      T4: T4
      T4a: T4
      T4b: T4
      T4c: T4
      T4d: T4
    skip_values:
      - T0
      - Ta
      - Tis
      - Tis (DCIS)
      - Tis (LCIS)
      - TX


  - enabled: true
    task_category: stage_component
    task_id: pathologic_n
    source_column: ajcc_pathologic_n
    ground_truth_source: ajcc_pathologic_n
    question_template: What is the AJCC pathologic N category for this case?
    options:
      - N0
      - N1
      - N2
      - N3
    value_map:
      N0: N0
      N0 (i-): N0
      N0 (i+): N0
      N0 (mol+): N0
      N1: N1
      N1a: N1
      N1b: N1
      N1c: N1
      N1mi: N1
      N2: N2
      N2a: N2
      N2b: N2
      N2c: N2
      N3: N3
      N3a: N3
      N3b: N3
    skip_values:
      - NX

boolean_tasks:
  - enabled: true
    task_category: mutation
    task_id_template: "{source_column}"
    gene_panel_by_project:
      TCGA-ACC: [TP53]
      TCGA-BLCA: [TP53, KDM6A, ARID1A, RB1, STAG2]
      TCGA-BRCA: [PIK3CA, TP53, CDH1, MAP3K1]
      TCGA-CESC: [EP300, FBXW7, PTEN, TP53, ARID1A]
      TCGA-CHOL: [PBRM1]
      TCGA-COAD: [APC, KRAS, PTEN, SMAD4, TP53]
      TCGA-DLBC: [KMT2D, PIM1, ARID1A, CD79B, HLA-B]
      TCGA-ESCA: [CDKN2A, TP53]
      TCGA-GBM: [PTEN, TP53, NF1, ATRX, PIK3R1]
      TCGA-HNSC: [TP53, CDKN2A, NOTCH1, NSD1, CASP8]
      TCGA-KICH: [TP53]
      TCGA-KIRC: [VHL, PBRM1, SETD2, BAP1, MTOR]
      TCGA-KIRP: []
      TCGA-LAML: []
      TCGA-LGG: [TP53, ATRX, IDH1, CIC, FUBP1]
      TCGA-LIHC: [CTNNB1, TP53]
      TCGA-LUAD: [TP53, KRAS, EGFR, STK11, NF1]
      TCGA-LUSC: [TP53, CDKN2A, NF1, PTEN, NOTCH1]
      TCGA-MESO: [BAP1, NF2, TP53]
      TCGA-OV: [NF1, TP53]
      TCGA-PAAD: [CDKN2A, KRAS, SMAD4, TP53]
      TCGA-PCPG: [HRAS]
      TCGA-PRAD: [SPOP, TP53]
      TCGA-READ: [APC, FBXW7, KRAS, TP53]
      TCGA-SARC: [ATRX, RB1, TP53]
      TCGA-SKCM: [BRAF, COL5A1, CFTR, NF1, TP53]
      TCGA-STAD: [TP53, ARID1A, APC, BCOR, SMAD4]
      TCGA-TGCT: [KIT]
      TCGA-THCA: [BRAF, NRAS]
      TCGA-THYM: [GTF2I, HRAS]
      TCGA-UCEC: [PIK3CA, ARID1A, PTEN, CTNNB1, CTCF]
      TCGA-UCS: [PTEN, TP53]
      TCGA-UVM: [EIF1AX, GNA11, GNAQ, SF3B1]
    question_template: What is the {gene} mutation status for this case?
    true_answer_template: "{gene} mutation present"
    false_answer_template: "{gene} mutation absent"
    choice_count: 2
    max_false_per_true: 1.0
    modality_combination_overrides:
      - name: all_available
        use_pathology: must_have             # path must have, other use if avail
        use_radiology: use_if_avail
        use_dnam: use_if_avail
        use_rna: use_if_avail

      - name: path_only
        use_pathology: must_have             # path must have
        use_radiology: not_include
        use_dnam: not_include
        use_rna: not_include

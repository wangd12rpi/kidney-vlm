model: gemma
modality: radiology
inference_mode: projector_training_mode # vqa_mode | projector_training_mode
sample_key: ""
sample_keys: []
max_samples: 5
sample_seed: 42
split_filter: test
checkpoint_name: best.ckpt
max_new_tokens: 96
do_sample: false
temperature: 1.0
top_p: 1.0
device: cuda:0
trust_remote_code: true
load_in_8bit: true
torch_dtype: bfloat16
autocast_dtype: bfloat16
projector_dtype: float32
attn_implementation: sdpa

modalities:
  gemma:
    pathology:
      projector_ckpt_path: ${project.root_dir}/outputs/projectors/gemma_4_e4b_it/pathology/path_resampler_20260422_002758_EST/best.ckpt
      qa_parquet_path: ${data.unified_registry_path}
      sample_key_field: sample_id
      feature_path_field: pathology_tile_embedding_paths
      label_field: project_id
      max_feature_tokens: 4096
      patch_compression_method: none
      patch_compression_kernel_size: 1
    radiology:
      projector_ckpt_path: ${project.root_dir}/outputs/projectors/gemma_4_e4b_it/radiology/best.ckpt
      qa_parquet_path: ${data.unified_registry_path}
      sample_key_field: sample_id
      feature_path_field: radiology_embedding_paths
      label_field: project_id
      max_feature_tokens: 128
